name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.34.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.22.2"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm brand:assets
      - run: pnpm env:setup
      - run: pnpm infra:up
      - run: pnpm --filter api db:deploy
      - run: pnpm --filter api db:validate
      - run: pnpm build
      - run: pnpm --filter api db:seed
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm security:secrets
      - run: pnpm audit --prod --audit-level high
      - name: Stop only this checkout's Circle.social infrastructure
        if: always()
        run: pnpm infra:down
